repos:
  - repo: local
    hooks:
      - id: local-release-audit
        name: Audit public candidates and binary metadata
        entry: python scripts/release_audit.py --expected-remote https://github.com/victormrreis/letranix-document-intelligence.git
        language: system
        pass_filenames: false
      - id: python-lint
        name: Ruff
        entry: python -m ruff check letranix tests scripts
        language: system
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
