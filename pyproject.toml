[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "letranix-document-intelligence"
version = "0.2.0"
description = "Local-first document intelligence with auditable human review"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "Pillow", "pypdf", "pypdfium2", "python-multipart"]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime==1.4.4"]

[tool.setuptools.packages.find]
include = ["letranix*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: real local OCR with optional engine"]
