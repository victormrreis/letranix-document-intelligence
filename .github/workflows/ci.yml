name: Validate synthetic workflow
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install --upgrade pip==26.2.2
      - run: python -m pip install -r requirements-lock.txt
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: python -m ruff check letranix tests scripts
      - run: python -m bandit -r letranix -q
      - run: python -m pytest -q
      - run: python scripts/release_audit.py --expected-remote "${{ github.server_url }}/${{ github.repository }}.git"
      - run: python -m pip_audit
      - run: npm audit --audit-level=high
      - run: npx playwright install chromium
      - name: Browser workflow with temporary synthetic workspace
        shell: pwsh
        run: |
          python -m letranix fixtures
          npm run test:e2e
          exit $LASTEXITCODE
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install and run Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .
