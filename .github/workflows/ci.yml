name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install --upgrade pip==26.2.2
      - run: python -m pip install -r requirements-lock.txt
      - run: npm ci
      - name: Frontend typecheck, lint, format, build
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run build
      - name: Python lint and static security analysis
        run: |
          python -m ruff check letranix tests scripts
          python -m bandit -r letranix -q
      - name: Backend tests (including real offline OCR)
        run: python -m pytest -q
      - name: Release audit of tracked files
        run: python scripts/release_audit.py --expected-remote "${{ github.server_url }}/${{ github.repository }}.git"
      - name: Dependency advisories
        run: |
          python -m pip_audit
          npm audit --audit-level=high
      - name: Desktop shell compiles
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: npx playwright install chromium
      - name: Browser end-to-end workflow on a fresh synthetic workspace
        run: npm run test:e2e
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks over full history
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "Gitleaks archive downloaded; scanning"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .
